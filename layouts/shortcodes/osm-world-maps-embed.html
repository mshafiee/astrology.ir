<div class="shortcode shortcode-osm-world-maps">
	<link   rel="stylesheet"
			href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
			integrity="sha384-VzLXTJGPSyTLX6d96AxgkKvE/LRb7ECGyTxuwtpjHnVWVZs2gp5RDjeM/tgBnVdM"
			crossorigin="anonymous"/>
	<script src="https://unpkg.com/jquery@3.6.0/dist/jquery.min.js"
			integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK"
			crossorigin="anonymous"></script>
	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
			integrity="sha384-RFZC58YeKApoNsIbBxf4z6JJXmh+geBSgkCQXFyh+4tiFSJmJBt+2FbjxW7Ar16M"
			crossorigin="anonymous"></script>
	<div id="map" style='border: 1px solid #AAA; width:{{ with .Get "width" }}{{.}}{{else}}100%{{end}}; height:{{ with .Get "height" }}{{.}}{{else}}300px{{end}}'></div>
	<script src='{{ relURL "js/" }}{{ .Site.Language.Lang }}-markers.js'></script>
	<script src='{{ relURL "js/map.js" }}'></script>
	{{ if eq .Site.Language.Lang "fa" }}
	<script>
		let target = L.latLng('{{ with .Get "lat" }}{{.}}{{else}}33{{end}}', '{{ with .Get "lng" }}{{.}}{{else}}53{{end}}');
		map.setView(target, {{ with .Get "zoom" }}{{.}}{{else}}6{{end}});
		</script>
	{{ end }}
</div>
