<div class="shortcode shortcode-osm-maps">
	<script src="https://unpkg.com/leaflet@1.9.1/dist/leaflet.js"></script>
	<link href="https://unpkg.com/leaflet@1.9.1/dist/leaflet.css" rel="stylesheet"/>
	<div id="osm-map"></div>
	<script>
		var element = document.getElementById('osm-map');
		element.style = 'border: 1px solid #AAA; width:{{ with .Get "width" }}{{.}}{{else}}100%{{end}}; height:{{ with .Get "height" }}{{.}}{{else}}300px{{end}}';
		var map = L.map(element);
		L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png', {
			attribution: '<div dir="ltr">{{ with .Get "attribution" }}{{.}} | {{else}}{{end}}&copy; <a href="https://astrology.ir/">astrology.ir</a></div>'
		}).addTo(map);
		map.attributionControl.setPrefix(false);
		var target = L.latLng('{{ with .Get "lat" }}{{.}}{{else}}35.7219{{end}}', '{{ with .Get "lng" }}{{.}}{{else}}51.3347{{end}}');
		map.setView(target, {{ with .Get "zoom" }}{{.}}{{else}}10{{end}});
		L.marker(target).addTo(map);
	</script>
</div>
